# dsh-im-bridge bundle patch (web profile composition layer)
#
# Inserts the IM bridge plugin row into the profile composition tree. The row
# is FAIL-SAFE BY DESIGN: every bridge connection (NapCat / WeChatFerry) is
# optional and retried in the background, so the DSH web process always boots
# even when no IM endpoint is reachable yet.
#
# To change settings, copy the whole `config:` block below into YOUR profile's
# cordis.patch.yml (C:\Users\<you>\.dsh\profiles\web\cordis.patch.yml) and edit
# the values there; the profile layer overrides this bundle layer.
- insert:
    - id: dsh-im-bridge
      name: 'dsh-im-bridge'
      config:
        # Master switch: set false to fully disable the plugin.
        enabled: true
        # info | warn | error | silent
        logLevel: 'info'
        # Plugin state dir (chat<->session mapping). Empty = $DSH_HOME/im-bridge/state
        stateDir: ''
        # Root dir holding one workspace per chat. Empty = $DSH_HOME/im-bridge/workspaces
        workspaceRoot: ''
        # Injected into every prompt so the agent knows it is chatting over IM
        # and how to send files (/send <absolute path> on its own line).
        systemHint: >-
          你正在通过 QQ / 微信聊天工具与用户对话。回复会直接发送给用户，请用用户的语言、
          简洁、友好、直接地回复，不要输出 Markdown 围栏、也不要输出内部工具调用细节。
          如果需要向用户发送文件（例如你生成或修改的文件、图片、压缩包），请在回复中
          单独一行写：/send <文件的绝对路径>（每行一个文件，路径必须是本机绝对路径）。
          如果用户发来了文件，文件路径会在消息中给出，你可以用文件工具读取。
        qq:
          enabled: true
          # NapCat / Lagrange 的 OneBot v11 WebSocket 服务器地址
          wsUrl: 'ws://127.0.0.1:3001'
          # OneBot access token（与 NapCat 配置一致）；留空则不鉴权
          accessToken: ''
          # 自己的 QQ 号（用于群聊 @ 判断）；0 = 启动时用 get_login_info 自动获取
          selfId: 0
          # 群聊里是否只有被 @ 时才回复
          requireMention: true
          # true = 只回复 admins 里的 QQ 私聊
          adminOnly: false
          admins: []
          # 非空时只服务这些会话 id（QQ 号 / 群号，字符串形式）
          allowedChats: []
          blockedChats: []
          # 单条消息最大字符数，超出自动分段
          maxMessageChars: 4000
        wechat:
          enabled: true
          # WeChatFerry (wcf) RPC 服务地址；接收消息占用 port+1
          host: '127.0.0.1'
          port: 10086
          # 群聊里是否要求被 @ 或命中 triggerKeyword 才回复
          requireMention: false
          # 群聊触发关键词；空 = 群聊也全部回复（慎用）
          triggerKeyword: ''
          adminOnly: false
          admins: []
          allowedChats: []
          blockedChats: []
          maxMessageChars: 2000
          # 微信文件目录（WeChat Files 的父目录）；空 = 自动探测
          wechatFilesDir: ''
        # Web 控制台（浏览器里启停 NapCat / 扫码）使用的路径配置
        napcat:
          # NapCat.Shell 运行目录（含 NapCatWinBootMain.exe / napcat.mjs / config）
          runDir: 'D:/work/DshWorkspace/NapCat/run'
          # 无安装版 QQ（9.9.22）可执行文件
          qqExe: 'D:/work/DshWorkspace/QQNT22/Files/QQ.exe'
          # 注入用 hook DLL；空 = runDir/NapCatWinBootHook.dll
          hookDll: ''
          # OneBot WebSocket 端口（插件 qq.wsUrl 需要与之匹配）
          wsPort: 3001
          # NapCat WebUI 端口
          webuiPort: 6099
          # 机器人 QQ 号；填写后启动时用快速登录（-q），空 = 每次扫码
          account: '3475536025'
